<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>SchoolCanteen · live audience count</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F1EDE6;color:#4F5F50;font-family:Inter,system-ui,-apple-system,sans-serif}
main{text-align:center;padding:24px}h1{font-size:28px;text-transform:uppercase;letter-spacing:-.5px;margin:0 0 4px}
p{margin:0;color:#C1693F;font-style:italic}
.row{display:flex;gap:28px;justify-content:center;margin:36px 0 20px;flex-wrap:wrap}
.card{background:#4F5F50;color:#F1EDE6;border-radius:32px;padding:24px 30px;min-width:190px}
.card b{display:block;font-size:96px;font-weight:800;line-height:1;color:#E9A57E;font-variant-numeric:tabular-nums}
.card span{font-size:18px}small{color:#7a776f}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3E8E5E;margin-right:6px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
</style></head><body><main>
<h1>Live audience count</h1><p>private page · the audience does not see this</p>
<div class="row"><div class="card" style="background:#C1693F"><b id="live" style="color:#fff">–</b><span>connected right now</span></div><div class="card"><b id="opens">–</b><span>phones opened the demo</span></div><div class="card"><b id="starts">–</b><span>slid to start</span></div><div class="card"><b id="left">–</b><span>left or switched away</span></div></div>
<small><span class="dot"></span><span id="st">connecting…</span> · opens and starts count each device once</small>
</main><script>
const G='https://countapi.mileshilliard.com/api/v1/get/scdemo_k7q2m9_';
async function g(k){const r=await fetch(G+k,{cache:'no-store'});const j=await r.json();return Number(j.value)||0;}
let prev=null;
async function tick(){try{const [o,st,j,l]=await Promise.all(['opens','starts','joins','leaves'].map(g));const live=Math.max(0,j-l);
opens.textContent=o;starts.textContent=st;left.textContent=l;document.getElementById('live').textContent=live;
let msg='updated '+new Date().toLocaleTimeString();if(prev!==null&&live<prev)msg+=' · '+(prev-live)+' just left';if(prev!==null&&live>prev)msg+=' · '+(live-prev)+' just joined';prev=live;
document.getElementById('st').textContent=msg;}catch(e){document.getElementById('st').textContent='counter unreachable, retrying…';}}
tick();setInterval(tick,4000);
</script></body></html>
